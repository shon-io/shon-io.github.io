<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Against Efficiency — $title$</title>
</head>

<body>
  <div id="root" class="dark">

    <header class="site-header">
      <span class="site-title">Against Efficiency</span>
    </header>

    <main class="page">
      <article>
        <h1 class="gb-title">$title$</h1>
        <span class="gb-kicker">$for(tags)$ $tags$$sep$ ·$endfor$</span>
        <span class="byline">$author$ · $date$</span>
        <div class="article-body">
          $body$
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <span class="copyright">Copyright $author$</span>
    </footer>

  </div>
</body>

</html>
